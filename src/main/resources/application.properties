spring.application.name=news

# PostgreSQL (cùng database với ứng dụng .NET WPF - AppConfig.PostgreSqlConnectionString)
spring.datasource.url=jdbc:postgresql://news-huge-cedar-pooler.sage.cloud.layerbase.dev:5432/news?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=uH7VtHKSwN8yJo93IQNxmyBU
spring.datasource.driver-class-name=org.postgresql.Driver

spring.mvc.servlet.path=/
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
spring.messages.encoding=UTF-8

# Chế độ web application: servlet (mặc định cho web service), none (cho background worker)
spring.main.web-application-type=${WEB_TYPE:servlet}

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Không.fail fast khi khởi động nếu DB tạm thời không kết nối được (lỗi chỉ xuất hiện khi truy vấn thực tế).
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# Logging
logging.level.com.tkd.news=DEBUG
logging.level.org.springframework.jdbc=INFO

