services:
  - type: web
    name: vietnam-news-web
    env: java
    region: singapore
    buildCommand: "./mvnw.cmd -q compile -o"
    startCommand: "java -jar target/news-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: web
      - key: WEB_TYPE
        value: servlet
      - key: DATABASE_URL
        fromDatabase:
          name: vietnam-news-db
          property: connectionString

  - type: worker
    name: vietnam-news-worker
    env: java
    region: singapore
    buildCommand: "./mvnw.cmd -q compile -o"
    startCommand: "java -jar target/news-0.0.1-SNAPSHOT.jar --spring.profiles.active=worker"
    envVars:
      - key: WEB_TYPE
        value: none
      - key: SPRING_PROFILES_ACTIVE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: vietnam-news-db
          property: connectionString

databases:
  - name: vietnam-news-db
    plan: starter
